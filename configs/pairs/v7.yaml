# UGC 广告配对数据集 v7（2026-09-27，当前版本，按 proposal 和 9/26 导师会议定的方案）
#
# 一个文件管一个数据集版本的全部参数，按流程分三段：
#   gt       GT 选取：预筛门槛、单片段模式的画幅
#   ugc      把高质量素材做成"像真实 UGC 广告"的 GT：编排、虚拟手持相机、烧录文字（GT 和 LQ 都有）
#   degrade  GT -> LQ：Real-ESRGAN / RealBasicVSR 式二阶退化（adup/degrade/second_order.py）
# 读取方：adup.make_pairs（全部）、adup.ugc.director（ugc.director）、adup.hq.gate（gt）。
# 每条配对的 meta.json 记录实际抽到的参数；数据集目录下的 config.yaml 是生成时用的这份。
# 临时改参数不用复制文件：--set degrade.rbvsr_prob=0.2
#
# 版本历史（旧版本文件在 git 历史里；v5 及更早的配对数据已删除，需要时按 commit 69e1f6c 重新生成）：
#   v1–v4  拍摄/ISP -> 剪辑导出 -> 平台转码（H.264/VP9/AV1/HEVC）-> 二次上传 的链式退化，逐步校准
#   v5     加入 UGC 化；GT 短边 1440，LQ 540–720
#   v6     以 Meta 为主的画幅（未生成数据）
#   v7     目标改为 1080p 输出：GT 1920x1080 / 1080x1920，横竖各半；LQ 360/540/720。
#          退化换成二阶流程（导师要求按 Real-ESRGAN / RealBasicVSR 的标准设计），编码器只用 H.264 和 VP9；
#          去掉手机色彩（成品偏艳偏暖，proposal 里也没有）；按源视频划分 train / dev / test

version: v7

gt:
  # 单片段模式（make_pairs --manifest）的 GT 画幅；director 编排的广告在 ugc.director.aspects 里选
  aspects: {"9:16": 0.5, "16:9": 0.5}
  # 预筛：在 GT 分辨率下测 3 帧
  min_detail: 12.0              # 拉普拉斯方差下限（太平、太虚的画面不要）
  luma_range: [30, 230]         # 平均亮度范围（过暗、过曝不要）
  max_downup_psnr: 38.0         # 有效分辨率：最清晰区域 ×2 下采样再上采样的 PSNR 上限；更高 = 没有真细节

ugc:
  director:
    aspects: {"9:16": 0.5, "16:9": 0.5}   # 横竖各半（9/26 会议）；真实广告 92–100% 是竖屏，测试集按真实分布
    # 帧率：248 条真实广告实测 30 fps 78%、24 fps 14%、25 fps 7%
    fps: {30: 0.79, 24: 0.14, 25: 0.07}
    # 广告风格（48 条真实广告人工标注，data/stats/real_ads/ad_anatomy.csv）：创作者（UGC）56% + 混合 10%，
    # 品牌 / 代理制作 25%，游戏 / AI 画面 6%（暂无素材，不做）
    styles: {ugc: 0.7, brand: 0.3}
    # 9:16 广告用横屏素材时，按这个概率做成竖屏版式（实测镜头占比：模糊填充 Meta 4.8%、TikTok 1.8%，分屏约 3%，黑边约 2%）
    portrait_layout_prob: 0.08
    portrait_layouts: {fit_blur: 0.5, fit_solid: 0.2, split: 0.3}
    # 镜头长度来自真实广告（data/stats/real_ads/shots.csv）；相邻镜头交替普通构图和放大
    punch_in_prob: 0.4
    punch_in_zoom: [1.12, 1.3]
    jump_skip_s: [0.1, 0.8]     # 跳剪跳过的素材长度
    transition_frames: {dissolve: [4, 12], whip: [4, 8], dip_black: [6, 12], dip_white: [6, 12]}
    scenes: [2, 4]              # 多场景广告的场景数（主素材 + 1–3 条）
    still_prob: 0.15            # 插入同主题照片（Ken Burns / 手持）
    pip_prob: 0.05              # 画中画反应
    collage_prob: 0.03          # 竖屏广告插一个 2×2 拼图镜头（标注：拼图 / 分屏 8%）
    screen_ad_prob: 0.05        # 竖屏广告插入 App 录屏（科技/App 类 ×4）；真实广告里录屏占画面约 3%，标注 10% 的广告有
    screen_pip_prob: 0.35       # 口播素材的录屏做成"录屏 + 人脸小窗"
    screen_phone_prob: 0.4      # 录屏放进手机外框（标注：手机样机 4%，多为手持手机拍屏）
    other_theme_share: 0.02     # --n-ads 抽样时，非广告主题（风景、古董等）素材合计占的比例
    # 按风格的剪辑参数（标注：多场景 UGC 56% / 品牌 67%，结尾卡片 UGC 7% / 品牌 25–60%，动效卡片品牌 50%）
    style:
      ugc:
        handheld_prob: 1.0          # 按真实广告抖动分布补手持抖动
        multi_scene_prob: 0.55      # 口播 + 产品 B-roll 等多场景
        same_source_prob: 0.7       # 多场景时优先用同一源视频的其他片段（同一创作者、同一场地）
        jump_cut_prob: 0.7          # 同一场景内相邻镜头跳剪
        transitions: {cut: 0.8, dissolve: 0.08, whip: 0.06, dip_black: 0.03, dip_white: 0.03}
        hook_slide_prob: 0.05       # 开场大字卡片
        card_prob: 0.03             # 中间的动效卡片（产品图 + 标题）
        end_card_prob: 0.1          # 结尾卡片（logo + CTA 按钮）
      brand:
        handheld_prob: 0.15         # 品牌片多为稳定器 / 三脚架
        multi_scene_prob: 0.7
        same_source_prob: 0.4
        jump_cut_prob: 0.1
        transitions: {cut: 0.65, dissolve: 0.2, whip: 0.05, dip_black: 0.05, dip_white: 0.05}
        hook_slide_prob: 0.03
        card_prob: 0.4
        end_card_prob: 0.45
    # 按源视频（UltraVideo 的 YouTube id）划分，同一源的所有片段、照片、录屏只进一个划分，合成前就分好
    split: {train: 0.8, dev: 0.1, test: 0.1}
  camera:
    # 虚拟手持相机。director 会按真实广告的抖动分布为每条广告改写 shake_rms，只补素材自身没有的那部分
    shake_prob: 0.5
    shake_rms: [0.15, 1.2]      # 画面宽度的百分比
    walk_prob: 0.15
    drift_prob: 0.5
    drift_pct: [0.3, 2.0]
    push_prob: 0.3
    push_zoom: [1.03, 1.12]
    base_zoom: [1.0, 1.0]
    roll_per_pct: 0.15
  still_camera: {shake_prob: 0.5, drift_prob: 0.8, push_prob: 0.8, push_zoom: [1.05, 1.2]}   # 照片镜头覆盖 camera 的这几项
  text:
    # 烧录文字和图形，按广告风格抽（48 条真实广告人工标注，data/stats/real_ads/ad_anatomy.csv）。逐帧的 alpha 存为 mask.mkv。
    # 标注到的出现率（UGC / 品牌）：字幕 44% / 8%，标题 19% / 83%，logo 7% / 58%，小字免责 4% / 25%，
    # CTA 按钮 4% / 17%，价格或优惠码 15% / 8%，TikTok 原生小字 11% / 0，箭头圈注 7% / 8%，emoji 4%
    by_style:
      ugc:   {logo: 0.07, headline: 0.22, caption: 0.45, native: 0.1, cta: 0.05, promo: 0.13, fine_print: 0.04, sticker: 0.08, annotation: 0.06}
      brand: {logo: 0.6, headline: 0.85, caption: 0.1, native: 0.0, cta: 0.25, promo: 0.1, fine_print: 0.28, sticker: 0.02, annotation: 0.06}
    # 字幕样式：细体白字（常见于 Meta）、底板、粗体大写 + 当前词高亮（CapCut 自动字幕）、卡拉 OK 底板
    caption_styles: {plain: 0.45, plate: 0.25, bold_pop: 0.2, karaoke: 0.1}
    emoji_prob: 0.05            # 每段字幕带 emoji 的概率

degrade:
  # LQ 短边（make_pairs --scale auto）：360 / 540 / 720 -> 1080，即 ×3 / ×2 / ×1.5
  lq_short: {360: 0.34, 540: 0.33, 720: 0.33}
  # 两套参数：rbvsr = Real-ESRGAN / RealBasicVSR / DOVE 训练用的原版范围（重退化，从轻微到"看不清"都有）；
  #           calibrated = 按真实 Meta 360p / 720p 广告校准的日常退化。
  # 训练集：每个 LQ 版本以 rbvsr_prob 的概率用 rbvsr，否则用 calibrated。先定 10%（2026-09-28）；
  # 参考工作的做法相当于 1.0（全部样本从 rbvsr 这一套宽范围里抽），作为消融：--set degrade.rbvsr_prob=1.0
  rbvsr_prob: 0.1
  # dev / test 用的网格（make_pairs --grid）：每条 GT 生成 尺寸 × 编码 的全部组合，用 calibrated；
  # 270 是 ×4 兼容子集。重退化子集（和训练集同分布）另跑一次：--grid --set degrade.grid.rbvsr_prob=1.0
  grid:
    lq_short: [270, 360, 540, 720]
    codec: [h264, vp9]
    rbvsr_prob: 0.0

  # ---------------------------------------------------------------- calibrated：日常退化，已按真实 Meta 360p / 720p 校准（docs/ugc_dataset.md 6.1）
  calibrated:
    stage1:                     # 拍摄 + 剪辑导出
      blur:
        prob: 0.5
        kernels: {iso: 0.405, aniso: 0.225, generalized_iso: 0.108, generalized_aniso: 0.027,
                  plateau_iso: 0.108, plateau_aniso: 0.027, sinc: 0.1}
        kernel_size: [7, 9, 11, 13, 15, 17, 19, 21]
        sigma: [0.2, 1.5]
        beta_gaussian: [0.5, 4]
        beta_plateau: [1, 2]
      resize:                   # 相对当前尺寸；创作者大多按原尺寸导出
        mode: {up: 0.0, down: 0.4, keep: 0.6}
        scale: [0.6, 1.0]
        interp: {bilinear: 0.3333, area: 0.3333, bicubic: 0.3334}
      noise:
        prob: 0.4
        type: {gaussian: 0.5, poisson: 0.5}
        gaussian_sigma: [1, 6]   # 0–255 单位
        poisson_scale: [0.05, 0.5]
        gray_prob: 0.4
      jpeg: {prob: 0.1, quality: [70, 95]}
      compress:                 # 剪辑 App 导出 / 首次上传
        prob: 1.0
        codec: {h264: 0.7, vp9: 0.3}
        bpp: [0.08, 0.5]        # 每像素比特，对数均匀
        keyint: [30, 60, 120, 250]
    extras:                     # UGC 额外项，只在第一阶段、缩放之前
      motion_blur_prob: 0.5     # 沿虚拟相机速度的运动模糊，长度 = 速度 × 快门比例
      shutter: [0.2, 1.0]
      sharpen_prob: 0.6         # 手机 ISP / 平台的 unsharp mask 锐化（真实广告实测有明显锐化光晕）
      sharpen_amount: [0.3, 1.0]
      sharpen_sigma: [0.8, 2.0]
    stage2:                     # 平台处理 / 转发
      blur:
        prob: 0.3
        kernels: {iso: 0.405, aniso: 0.225, generalized_iso: 0.108, generalized_aniso: 0.027,
                  plateau_iso: 0.108, plateau_aniso: 0.027, sinc: 0.1}
        kernel_size: [7, 9, 11, 13, 15, 17, 19, 21]
        sigma: [0.2, 0.8]
        beta_gaussian: [0.5, 4]
        beta_plateau: [1, 2]
      resize:
        mode: {up: 0.1, down: 0.3, keep: 0.6}
        scale: [0.6, 1.3]
        interp: {bilinear: 0.3333, area: 0.3333, bicubic: 0.3334}
      noise:
        prob: 0.2
        type: {gaussian: 0.5, poisson: 0.5}
        gaussian_sigma: [1, 4]
        poisson_scale: [0.05, 0.3]
        gray_prob: 0.4
      jpeg: {prob: 0.05, quality: [60, 95]}
    final:                      # 平台转码：多数先缩到 LQ 尺寸再编码
      # 以下按 Meta 同一条广告的 720p / 360p 半配对校准（adup/analysis/calib_final.py，18 条，2026-09-28）：
      # 最像 Meta 的是 area / bilinear 缩小、不加 sinc；Meta 360p 是 H.264 Main，0.052 bpp（四分位 0.043–0.062），GOP 约 144
      compress_first_prob: 0.2
      interp: {area: 0.4, bilinear: 0.4, bicubic: 0.15, lanczos: 0.05}
      sinc: {prob: 0.1, kernels: {sinc: 1.0}, kernel_size: [7, 9, 11, 13, 15, 17, 19, 21]}
      compress:
        prob: 1.0
        codec: {h264: 0.6, vp9: 0.4}
        bpp: [0.035, 0.09]      # 真实：Meta 360p 0.052、720p 0.058、TikTok 720p 约 0.06（中位数）
        keyint: [60, 110, 144, 250]

  # ---------------------------------------------------------------- rbvsr：RealBasicVSR 原版参数（训练默认）
  # 与 realbasicvsr_wogan_c64b20_2x30x8_lr1e-4_300k_reds.py 相同，除了：编码器 libx264/h264/mpeg4 -> H.264/VP9，
  # 码率 1e4–1e5 bit/帧（256 px 裁块）换算成 0.15–1.5 bpp，参数整段固定（原版逐帧有小幅漂移）
  rbvsr:
    stage1:
      blur:
        prob: 1.0
        kernels: {iso: 0.405, aniso: 0.225, generalized_iso: 0.108, generalized_aniso: 0.027,
                  plateau_iso: 0.108, plateau_aniso: 0.027, sinc: 0.1}
        kernel_size: [7, 9, 11, 13, 15, 17, 19, 21]
        sigma: [0.2, 3]
        beta_gaussian: [0.5, 4]
        beta_plateau: [1, 2]
      resize:
        mode: {up: 0.2, down: 0.7, keep: 0.1}
        scale: [0.15, 1.5]
        interp: {bilinear: 0.3333, area: 0.3333, bicubic: 0.3334}
      noise:
        prob: 1.0
        type: {gaussian: 0.5, poisson: 0.5}
        gaussian_sigma: [1, 30]
        poisson_scale: [0.05, 3]
        gray_prob: 0.4
      jpeg: {prob: 1.0, quality: [30, 95]}
      compress:
        prob: 1.0
        codec: {h264: 0.5, vp9: 0.5}
        bpp: [0.15, 1.5]
        keyint: [30, 60, 120, 250]
    extras: {motion_blur_prob: 0.0, shutter: [0.2, 1.0], sharpen_prob: 0.0, sharpen_amount: [0.3, 1.0], sharpen_sigma: [0.8, 2.0]}
    stage2:
      blur:
        prob: 0.8
        kernels: {iso: 0.405, aniso: 0.225, generalized_iso: 0.108, generalized_aniso: 0.027,
                  plateau_iso: 0.108, plateau_aniso: 0.027, sinc: 0.1}
        kernel_size: [7, 9, 11, 13, 15, 17, 19, 21]
        sigma: [0.2, 1.5]
        beta_gaussian: [0.5, 4]
        beta_plateau: [1, 2]
      resize:
        mode: {up: 0.3, down: 0.4, keep: 0.3}
        scale: [0.3, 1.2]
        interp: {bilinear: 0.3333, area: 0.3333, bicubic: 0.3334}
      noise:
        prob: 1.0
        type: {gaussian: 0.5, poisson: 0.5}
        gaussian_sigma: [1, 25]
        poisson_scale: [0.05, 2.5]
        gray_prob: 0.4
      jpeg: {prob: 1.0, quality: [30, 95]}
    final:
      compress_first_prob: 0.5
      interp: {bilinear: 0.3333, area: 0.3333, bicubic: 0.3334}
      sinc: {prob: 0.8, kernels: {sinc: 1.0}, kernel_size: [7, 9, 11, 13, 15, 17, 19, 21]}
      compress:
        prob: 1.0
        codec: {h264: 0.5, vp9: 0.5}
        bpp: [0.15, 1.5]
        keyint: [30, 60, 120, 250]
